<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve theme before first paint to avoid a light/dark flash. Use
      // the saved choice if there is one, else follow the OS preference.
      // Mirrors the resolution in src/components/theme-switch.tsx.
      //
      // Also seed the theme-color meta here so the browser chrome (iOS status
      // bar + Safari bottom toolbar) is the right tone from the very first
      // frame. We can't read --background yet (stylesheets haven't parsed), so
      // the hex is hardcoded to the resolved --background per theme; once React
      // mounts, theme-switch.tsx re-syncs it to the exact computed value. There
      // is no static <meta name="theme-color"> in <head> — this is the sole
      // source so theme-switch.tsx's single-node remove/re-insert stays valid.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = dark ? "#170d06" : "#f5f0e8";
          document.head.appendChild(meta);
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#f5f0e8">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <!-- theme-color is injected by the inline script above (and kept in sync by
         theme-switch.tsx) so it tracks the active theme; no static tag here. -->
    <!-- The only viewport tag. Deliberately carries no `maximum-scale` or
         `user-scalable` — locking zoom fails WCAG 1.4.4, and Safari ignores it
         for pinch anyway, so the lock only ever punished other browsers. The
         iOS focus-zoom it was there to suppress is handled properly instead:
         every text input renders at 16px on mobile (`text-base sm:text-sm`). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ddbx · Director Dealings — UK Insider Transactions</title>
    <meta key="title" content="ddbx · Director Dealings — UK Insider Transactions" property="og:title" />
    <meta
      content="Analysed UK director dealings and insider transactions, updated throughout the trading day."
      property="og:description"
    />
    <meta
      content="Analysed UK director dealings and insider transactions, updated throughout the trading day."
      name="description"
    />
    <!-- Open Graph / Twitter share image. The ddbx wordmark is the default
         (light, UK); functions/_middleware.js swaps it to the dark variant
         (og-us.png) on ddbx.us, since every domain serves this same static
         shell to crawlers. Per-trade /t/{id} links set their own image. -->
    <meta content="website" property="og:type" />
    <meta content="https://ddbx.uk/og-uk.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="675" property="og:image:height" />
    <meta content="ddbx — insider market intelligence" property="og:image:alt" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="@ddbxuk" name="twitter:site" />
    <meta content="https://ddbx.uk/og-uk.png" name="twitter:image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>

  </body>
