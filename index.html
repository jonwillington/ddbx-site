<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve theme before first paint to avoid a light/dark flash. Use
      // the saved choice if there is one, else follow the OS preference.
      // Mirrors the resolution in src/components/theme-switch.tsx.
      //
      // Also seed the browser chrome here so it is the right tone from the very
      // first frame. Two surfaces, because two generations of iOS read
      // different ones: the theme-color meta (older iOS + Android Chrome) and
      // the root element's own background (iOS 26, which ignores the meta and
      // samples the page). We can't read --background yet — stylesheets haven't
      // parsed — so the hex is hardcoded, and it MUST equal THEME_COLOR in
      // src/lib/theme.ts, which re-applies both once React mounts. When those
      // two drifted apart the status bar and the bottom toolbar ended up
      // painting different colours from different sources.
      //
      // There is no static <meta name="theme-color"> in <head> — this is the
      // sole source, so theme.ts's single-node remove/re-insert stays valid.
      //
      // The `js` class is the other thing settled before first paint: it tells
      // the stylesheet below to suppress the crawler pre-render that the Pages
      // Functions inject into #root (shared/prerender.js). React wipes that
      // markup when it mounts, but only after the bundle downloads, parses and
      // runs — on /companies that is a few hundred ms of a visibly different
      // page, in near-invisible dark-on-dark ink once the theme resolves. A
      // browser that runs JS never wants to see it; a crawler that doesn't run
      // JS never sets the class, so it still gets the full link list.
      //
      // The class has to be set here, before the body parses, or the
      // pre-render paints anyway while the module bundle is still on the
      // wire. The cost is the browser whose bundle never arrives (a stale
      // cached shell against a redeployed hash, a throw before mount): it
      // would sit on a blank page. So the class is provisional — main.tsx
      // marks the document `mounted`, and if that hasn't happened in eight
      // seconds the pre-render is let back through.
      (function () {
        try {
          document.documentElement.classList.add("js");
          setTimeout(function () {
            if (!document.documentElement.classList.contains("mounted")) {
              document.documentElement.classList.remove("js");
            }
          }, 8000);
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var hex = dark ? "#231811" : "#f5f0e8";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.backgroundColor = hex;
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = hex;
          document.head.appendChild(meta);
        } catch (e) {}
      })();
    </script>
    <!-- Inline, and it has to be: globals.css is imported from src/main.tsx and
         so arrives with the bundle — far too late to suppress a paint that
         happens before the bundle has even downloaded. One rule, three lines
         from the class that gates it. -->
    <style>
      html.js #prerender {
        display: none;
      }
    </style>
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#f5f0e8">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <!-- theme-color is injected by the inline script above (and kept in sync by
         theme-switch.tsx) so it tracks the active theme; no static tag here. -->
    <!-- The only viewport tag. Deliberately carries no `maximum-scale` or
         `user-scalable` — locking zoom fails WCAG 1.4.4, and Safari ignores it
         for pinch anyway, so the lock only ever punished other browsers. The
         iOS focus-zoom it was there to suppress is handled properly instead:
         every text input renders at 16px on mobile (`text-base sm:text-sm`). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ddbx · Director Dealings — UK Insider Transactions</title>
    <meta key="title" content="ddbx · Director Dealings — UK Insider Transactions" property="og:title" />
    <meta
      content="Analysed UK director dealings and insider transactions, updated throughout the trading day."
      property="og:description"
    />
    <meta
      content="Analysed UK director dealings and insider transactions, updated throughout the trading day."
      name="description"
    />
    <!-- Open Graph / Twitter share image. The ddbx wordmark is the default
         (light, UK); functions/_middleware.js swaps it to the dark variant
         (og-us.png) on ddbx.us, since every domain serves this same static
         shell to crawlers. Per-trade /t/{id} links set their own image. -->
    <meta content="website" property="og:type" />
    <meta content="https://ddbx.uk/og-uk.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="675" property="og:image:height" />
    <meta content="ddbx — insider market intelligence" property="og:image:alt" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="@ddbxuk" name="twitter:site" />
    <meta content="https://ddbx.uk/og-uk.png" name="twitter:image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
