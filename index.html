    <script>
      // Resolve theme before first paint to avoid a light/dark flash. Use
      // the saved choice if there is one, else follow the OS preference.
      // Mirrors the resolution in src/components/theme-switch.tsx.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
